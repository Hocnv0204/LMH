version: "3.9"

services:
  # ==========================
  # 1️⃣ PostgreSQL Database
  # ==========================
  postgres:
    image: postgres:16
    container_name: lmh_postgres
    restart: always
    environment:
      POSTGRES_DB: lmh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lmh_network

  # ==========================
  # 2️⃣ Redis Cache
  # ==========================
  redis:
    image: redis:7
    container_name: lmh_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - lmh_network


# ==========================
# 4️⃣ Networks & Volumes
# ==========================
networks:
  lmh_network:
    driver: bridge

volumes:
  postgres_data:
